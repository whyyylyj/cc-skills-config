project:
  name: "Claude Code Configs"
  version: "1.0.0"
  description: "常用 Claude Code 配置分享仓库"
  repository: "https://github.com/your-username/claude-configs"

categories:
  skills:
    - id: "config-installer"
      name: "Config Installer"
      description: "从 Git 仓库安装 Claude Code 配置"
      path: "skills/config-installer/skill.md"
      platforms: ["all"]
      dependencies: []

    - id: "java-e2e"
      name: "Java E2E Testing"
      description: "Java/Spring Boot 端到端测试工具"
      path: "skills/java-e2e/skill.md"
      platforms: ["all"]
      dependencies: []

    - id: "mysql-mcp-setup"
      name: "MySQL MCP Setup"
      description: "自动检测项目数据库配置并设置 MCP MySQL 连接。支持 Spring Boot, Node.js, Python, Go, PHP, Ruby 等多种项目类型。"
      path: "skills/mysql-mcp-setup/skill.md"
      platforms: ["all"]
      dependencies: []
      features:
        - "智能项目类型检测"
        - "自动解析数据库配置"
        - "支持多种配置格式"
        - "一键配置 MCP MySQL 连接"
      external_repo: "https://github.com/yourusername/mysql-mcp-setup"

    - id: "contribute"
      name: "Contribute Config"
      description: "将本地 Claude Code 配置整理成可分享的安装脚本。支持导出 skills, MCP 服务器, commands, hooks，自动过滤敏感信息，检测重复配置。"
      path: "skills/contribute/skill.md"
      platforms: ["all"]
      dependencies: []
      features:
        - "自动扫描已安装配置"
        - "敏感信息过滤"
        - "重复配置检测"
        - "生成完整安装包"

  mcp:
    - id: "mysql"
      name: "MySQL MCP Server"
      description: "MySQL 数据库连接和管理工具"
      path: "mcp/mysql/"
      platforms: ["linux", "macos", "windows"]
      install_script: "mcp/mysql/install.sh"

    - id: "tavily"
      name: "Tavily MCP Server"
      description: "Tavily AI 驱动的网络搜索和问答工具，支持实时搜索、深度研究和智能问答"
      path: "mcp/tavily/"
      platforms: ["linux", "macos", "windows"]
      install_script: "mcp/tavily/install.py"
      docs_url: "https://docs.tavily.com/"
      signup_url: "https://www.tavily.com/"
      requires_python: true

  aliases:
    - id: "claude-dsp"
      name: "Claude DSP Alias"
      description: "Claude Code 快捷别名，跳过权限检查以提供更流畅的开发体验"
      path: "alias/claude-dsp/"
      platforms: ["linux", "macos", "windows"]
      install_script: "alias/claude-dsp/install.sh"
      warning: "仅用于信任的开发环境，会跳过文件操作和命令执行的权限确认"

  commands:
    - id: "commit"
      name: "Smart Commit"
      description: "智能 Git 提交命令，使用 AI 生成提交信息"
      path: "commands/commit/command.md"
      platforms: ["all"]

  hooks:
    - id: "user-prompt-submit"
      name: "User Prompt Hook"
      description: "用户提交前的处理钩子，验证和增强提示"
      path: "hooks/user-prompt-submit/hook.sh"
      platforms: ["all"]
